plugins {
    id "com.android.application"
}

android {
    namespace "in.gochar.app"
    compileSdk 35

    defaultConfig {
        applicationId "in.gochar.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
    }
}
