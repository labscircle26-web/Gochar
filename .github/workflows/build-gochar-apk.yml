name: Build Gochar APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-gochar-apk.yml"
      - "public/gochar-icon-192.png"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gochar-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Gochar APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Gochar
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Gochar launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp public/gochar-icon-192.png android/app/src/main/res/drawable-nodpi/gochar_icon.png

      - name: Build APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug

      - name: Name APK Gochar.apk
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Gochar.apk

      - name: Upload Gochar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gochar-APK
          path: output/Gochar.apk
          if-no-files-found: error
          retention-days: 14
