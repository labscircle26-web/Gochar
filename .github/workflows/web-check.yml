name: Gochar web checks

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/web-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/web-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gochar-web-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Gochar
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: |
          node --experimental-strip-types --test \
            src/lib/app-data/app-data.test.ts \
            src/lib/app-data/readiness-schedule.test.ts \
            src/lib/auth/gate-identity.test.ts \
            src/lib/auth/sign-in-gate.test.ts \
            src/lib/astro/calc.test.ts \
            src/lib/astro/personal-alerts.test.ts
